name: Build SG CALCI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/sarvesh/sgcalci
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html

          if [ -f icon-512.png ]; then
            cp icon-512.png app/src/main/res/drawable/sg_calci_icon.png
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SG-CALCI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sarvesh.sgcalci'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sarvesh.sgcalci'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00e5ff</item>
                  <item name="android:navigationBarColor">#02050b</item>
                  <item name="android:statusBarColor">#02050b</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="SG CALCI"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:icon="@drawable/sg_calci_icon"
                  android:roundIcon="@drawable/sg_calci_icon">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/sarvesh/sgcalci/MainActivity.java <<'EOF'
          package com.sarvesh.sgcalci;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;

              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebView.setWebContentsDebuggingEnabled(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }

                          MainActivity.this.filePathCallback = filePathCallback;

                          Intent intent =
                                  fileChooserParams.createIntent();

                          try {
                              startActivityForResult(
                                      intent,
                                      FILE_CHOOSER_REQUEST
                              );
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }

                          return true;
                      }
                  });

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.loadUrl(
                      "https://sarveshghane77-cmyk.github.io/sarvesh-2099-calculator/"
                  );

                  setContentView(webView);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode == FILE_CHOOSER_REQUEST) {

                      Uri[] results = null;

                      if (resultCode == RESULT_OK && data != null) {

                          if (data.getClipData() != null) {

                              int count =
                                      data.getClipData().getItemCount();

                              results = new Uri[count];

                              for (int i = 0; i < count; i++) {
                                  results[i] =
                                      data.getClipData()
                                          .getItemAt(i)
                                          .getUri();
                              }

                          } else if (data.getData() != null) {

                              results =
                                  new Uri[]{
                                      data.getData()
                                  };
                          }
                      }

                      if (filePathCallback != null) {

                          filePathCallback.onReceiveValue(
                                  results
                          );

                          filePathCallback = null;
                      }
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download Gradle
        run: |

          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

      - name: Build APK
        run: |

          ./gradle-8.7/bin/gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload SG CALCI APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-CALCI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
