name: Build SG CALCI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Create Android project directories
      # =========================================================
      - name: Create Android project directories
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/sarvesh/sgcalci
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

      # =========================================================
      # 4. Download Gradle
      # =========================================================
      - name: Download Gradle
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O gradle.zip

          unzip -q gradle.zip

      # =========================================================
      # 5. settings.gradle
      # =========================================================
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SGCALCI"

          include(":app")
          EOF

      # =========================================================
      # 6. Root build.gradle
      # =========================================================
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

      # =========================================================
      # 7. gradle.properties
      # =========================================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # =========================================================
      # 8. app/build.gradle
      # =========================================================
      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sarvesh.sgcalci'

              compileSdk 34

              defaultConfig {
                  applicationId 'com.sarvesh.sgcalci'

                  minSdk 23
                  targetSdk 34

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      # =========================================================
      # 9. Download app icon
      # =========================================================
      - name: Download SG CALCI icon
        shell: bash
        run: |
          set -e

          curl -fL \
            https://raw.githubusercontent.com/sarveshghane77-cmyk/sarvesh-2099-calculator/main/icon-512.png \
            -o app/src/main/res/drawable/sg_calci_icon.png

      # =========================================================
      # 10. Android colors
      # =========================================================
      - name: Create colors.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>
              <color name="black">#02050B</color>
          </resources>
          EOF

      # =========================================================
      # 11. Android strings
      # =========================================================
      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>
              <string name="app_name">SG CALCI</string>
          </resources>
          EOF

      # =========================================================
      # 12. Android theme
      # =========================================================
      - name: Create styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowNoTitle">true</item>

                  <item name="android:colorAccent">
                      #00E5FF
                  </item>

                  <item name="android:statusBarColor">
                      #02050B
                  </item>

                  <item name="android:navigationBarColor">
                      #02050B
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF

      # =========================================================
      # 13. Android Manifest
      # =========================================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/sg_calci_icon"
                  android:roundIcon="@drawable/sg_calci_icon"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # =========================================================
      # 14. MainActivity.java
      # =========================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e

          cat > app/src/main/java/com/sarvesh/sgcalci/MainActivity.java <<'EOF'
          package com.sarvesh.sgcalci;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.Base64;

          public class MainActivity extends Activity {

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;

              private static final int FILE_CHOOSER_REQUEST = 9001;

              private static final String APP_URL =
                      "https://sarveshghane77-cmyk.github.io/sarvesh-2099-calculator/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  configureWebView();

                  webView.loadUrl(APP_URL);
              }

              private void configureWebView() {

                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  settings.setSupportMultipleWindows(false);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setLoadsImagesAutomatically(true);

                  settings.setCacheMode(
                          WebSettings.LOAD_DEFAULT
                  );

                  webView.setBackgroundColor(
                          Color.rgb(2, 5, 11)
                  );

                  webView.setOverScrollMode(
                          WebView.OVER_SCROLL_NEVER
                  );

                  webView.addJavascriptInterface(
                          new ExportBridge(),
                          "SGCalciAndroid"
                  );

                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if (filePathCallback != null) {
                                      filePathCallback
                                              .onReceiveValue(null);
                                  }

                                  filePathCallback = callback;

                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                          );

                                  intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                  );

                                  intent.setType("*/*");

                                  intent.putExtra(
                                          Intent.EXTRA_ALLOW_MULTIPLE,
                                          true
                                  );

                                  try {

                                      startActivityForResult(
                                              intent,
                                              FILE_CHOOSER_REQUEST
                                      );

                                  } catch (Exception e) {

                                      filePathCallback = null;

                                      Toast.makeText(
                                              MainActivity.this,
                                              "File picker could not open",
                                              Toast.LENGTH_SHORT
                                      ).show();

                                      return false;
                                  }

                                  return true;
                              }
                          }
                  );

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                          view,
                                          url
                                  );

                                  installExportBridge();
                              }
                          }
                  );

                  webView.setDownloadListener(
                          new DownloadListener() {

                              @Override
                              public void onDownloadStart(
                                      String url,
                                      String userAgent,
                                      String contentDisposition,
                                      String mimeType,
                                      long contentLength) {

                                  try {

                                      Intent intent =
                                              new Intent(
                                                      Intent.ACTION_VIEW,
                                                      Uri.parse(url)
                                              );

                                      startActivity(intent);

                                  } catch (Exception e) {

                                      Toast.makeText(
                                              MainActivity.this,
                                              "Download could not be opened",
                                              Toast.LENGTH_SHORT
                                      ).show();
                                  }
                              }
                          }
                  );
              }

              /*
               * Connects the HTML download button to native Android.
               */
              private void installExportBridge() {

                  String javascript =
                          "(function(){" +

                          "if(window.__SG_CALCI_BRIDGE_INSTALLED__)return;" +

                          "window.__SG_CALCI_BRIDGE_INSTALLED__=true;" +

                          "document.addEventListener('click',function(e){" +

                          "var a=e.target.closest?" +
                          "e.target.closest('a[download]'):null;" +

                          "if(!a)return;" +

                          "var href=a.href;" +

                          "var name=a.download||'SG_CALCI_export';" +

                          "if(!href)return;" +

                          "e.preventDefault();" +

                          "e.stopPropagation();" +

                          "fetch(href)" +

                          ".then(function(r){" +
                          "return r.blob();" +
                          "})" +

                          ".then(function(blob){" +

                          "var reader=new FileReader();" +

                          "reader.onloadend=function(){" +

                          "var result=reader.result||'';" +

                          "var comma=result.indexOf(',');" +

                          "var base64=comma>=0?" +
                          "result.substring(comma+1):result;" +

                          "var mime=blob.type||" +
                          "'application/octet-stream';" +

                          "window.SGCalciAndroid.exportBase64(" +

                          "name,mime,base64" +

                          ");" +

                          "};" +

                          "reader.readAsDataURL(blob);" +

                          "})" +

                          ".catch(function(){" +

                          "window.SGCalciAndroid.exportFailed(" +
                          "'Could not read exported file');" +

                          "});" +

                          "},true);" +

                          "})();";

                  webView.evaluateJavascript(
                          javascript,
                          null
                  );
              }

              /*
               * File picker result.
               */
              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode != FILE_CHOOSER_REQUEST) {
                      return;
                  }

                  if (filePathCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == RESULT_OK &&
                          data != null) {

                      if (data.getClipData() != null) {

                          int count =
                                  data.getClipData()
                                      .getItemCount();

                          results = new Uri[count];

                          for (int i = 0; i < count; i++) {

                              results[i] =
                                      data.getClipData()
                                          .getItemAt(i)
                                          .getUri();
                          }

                      } else if (data.getData() != null) {

                          results = new Uri[]{
                                  data.getData()
                          };
                      }
                  }

                  filePathCallback
                          .onReceiveValue(results);

                  filePathCallback = null;
              }

              /*
               * JavaScript bridge.
               */
              public class ExportBridge {

                  @android.webkit.JavascriptInterface
                  public void exportBase64(
                          String fileName,
                          String mimeType,
                          String base64Data) {

                      new Thread(
                              () -> {

                                  try {

                                      byte[] data =
                                              Base64.getDecoder()
                                                    .decode(
                                                            base64Data
                                                    );

                                      saveExportedFile(
                                              fileName,
                                              mimeType,
                                              data
                                      );

                                  } catch (Exception e) {

                                      showExportError(
                                              "Export failed"
                                      );
                                  }

                              }
                      ).start();
                  }

                  @android.webkit.JavascriptInterface
                  public void exportFailed(
                          String message) {

                      showExportError(message);
                  }
              }

              private void showExportError(
                      String message) {

                  runOnUiThread(
                          () -> Toast.makeText(
                                  MainActivity.this,
                                  message,
                                  Toast.LENGTH_LONG
                          ).show()
                  );
              }

              /*
               * Save exported file.
               */
              private void saveExportedFile(
                      String originalName,
                      String mimeType,
                      byte[] data) {

                  try {

                      String safeName =
                              sanitizeFileName(
                                      originalName
                              );

                      if (safeName.length() == 0) {

                          safeName =
                                  "SG_CALCI_export";
                      }

                      if (mimeType == null ||
                              mimeType.trim().isEmpty()) {

                          mimeType =
                                  "application/octet-stream";
                      }

                      if (Build.VERSION.SDK_INT >= 29) {

                          saveWithMediaStore(
                                  safeName,
                                  mimeType,
                                  data
                          );

                      } else {

                          saveForOldAndroid(
                                  safeName,
                                  mimeType,
                                  data
                          );
                      }

                  } catch (Exception e) {

                      showExportError(
                              "Could not export file"
                      );
                  }
              }

              /*
               * Android 10+ MediaStore export.
               */
              private void saveWithMediaStore(
                      String fileName,
                      String mimeType,
                      byte[] data) {

                  try {

                      ContentResolver resolver =
                              getContentResolver();

                      ContentValues values =
                              new ContentValues();

                      values.put(
                              MediaStore.MediaColumns.DISPLAY_NAME,
                              fileName
                      );

                      values.put(
                              MediaStore.MediaColumns.MIME_TYPE,
                              mimeType
                      );

                      values.put(
                              MediaStore.MediaColumns.IS_PENDING,
                              1
                      );

                      Uri collection;

                      if (mimeType.startsWith("image/")) {

                          collection =
                                  MediaStore.Images.Media
                                      .getContentUri(
                                          MediaStore.VOLUME_EXTERNAL_PRIMARY
                                      );

                          values.put(
                                  MediaStore.MediaColumns.RELATIVE_PATH,
                                  Environment.DIRECTORY_PICTURES
                                          + "/SG CALCI"
                          );

                      } else if (mimeType.startsWith("video/")) {

                          collection =
                                  MediaStore.Video.Media
                                      .getContentUri(
                                          MediaStore.VOLUME_EXTERNAL_PRIMARY
                                      );

                          values.put(
                                  MediaStore.MediaColumns.RELATIVE_PATH,
                                  Environment.DIRECTORY_MOVIES
                                          + "/SG CALCI"
                          );

                      } else if (mimeType.startsWith("audio/")) {

                          collection =
                                  MediaStore.Audio.Media
                                      .getContentUri(
                                          MediaStore.VOLUME_EXTERNAL_PRIMARY
                                      );

                          values.put(
                                  MediaStore.MediaColumns.RELATIVE_PATH,
                                  Environment.DIRECTORY_MUSIC
                                          + "/SG CALCI"
                          );

                      } else {

                          collection =
                                  MediaStore.Downloads
                                      .getContentUri(
                                          MediaStore.VOLUME_EXTERNAL_PRIMARY
                                      );

                          values.put(
                                  MediaStore.MediaColumns.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS
                                          + "/SG CALCI"
                          );
                      }

                      Uri uri =
                              resolver.insert(
                                      collection,
                                      values
                              );

                      if (uri == null) {

                          throw new Exception(
                                  "MediaStore insert failed"
                          );
                      }

                      try {

                          OutputStream output =
                                  resolver.openOutputStream(uri);

                          if (output == null) {

                              throw new Exception(
                                      "Output stream unavailable"
                              );
                          }

                          output.write(data);

                          output.flush();

                          output.close();

                          ContentValues finished =
                                  new ContentValues();

                          finished.put(
                                  MediaStore.MediaColumns.IS_PENDING,
                                  0
                          );

                          resolver.update(
                                  uri,
                                  finished,
                                  null,
                                  null
                          );

                          showExportSuccess();

                      } catch (Exception e) {

                          try {

                              resolver.delete(
                                      uri,
                                      null,
                                      null
                              );

                          } catch (Exception ignored) {
                          }

                          throw e;
                      }

                  } catch (Exception e) {

                      showExportError(
                              "Could not save file to device"
                      );
                  }
              }

              /*
               * Android 9 and older.
               */
              private void saveForOldAndroid(
                      String fileName,
                      String mimeType,
                      byte[] data) {

                  FileOutputStream output = null;

                  try {

                      String folder;

                      if (mimeType.startsWith("image/")) {

                          folder =
                                  Environment.DIRECTORY_PICTURES;

                      } else if (mimeType.startsWith("video/")) {

                          folder =
                                  Environment.DIRECTORY_MOVIES;

                      } else if (mimeType.startsWith("audio/")) {

                          folder =
                                  Environment.DIRECTORY_MUSIC;

                      } else {

                          folder =
                                  Environment.DIRECTORY_DOWNLOADS;
                      }

                      File baseDirectory =
                              Environment
                                      .getExternalStoragePublicDirectory(
                                              folder
                                      );

                      File appDirectory =
                              new File(
                                      baseDirectory,
                                      "SG CALCI"
                              );

                      if (!appDirectory.exists()) {

                          if (!appDirectory.mkdirs() &&
                                  !appDirectory.exists()) {

                              throw new Exception(
                                      "Could not create folder"
                              );
                          }
                      }

                      File outputFile =
                              new File(
                                      appDirectory,
                                      fileName
                              );

                      output =
                              new FileOutputStream(
                                      outputFile
                              );

                      output.write(data);

                      output.flush();

                      output.close();

                      output = null;

                      android.media.MediaScannerConnection
                              .scanFile(
                                      MainActivity.this,
                                      new String[]{
                                              outputFile.getAbsolutePath()
                                      },
                                      new String[]{
                                              mimeType
                                      },
                                      null
                              );

                      showExportSuccess();

                  } catch (Exception e) {

                      showExportError(
                              "Could not save file"
                      );

                  } finally {

                      if (output != null) {

                          try {
                              output.close();
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }

              private void showExportSuccess() {

                  runOnUiThread(
                          () -> Toast.makeText(
                                  MainActivity.this,
                                  "Exported to device",
                                  Toast.LENGTH_LONG
                          ).show()
                  );
              }

              private String sanitizeFileName(
                      String name) {

                  if (name == null) {

                      return "SG_CALCI_export";
                  }

                  String result =
                          name.replaceAll(
                                  "[\\\\/:*?\"<>|]",
                                  "_"
                          );

                  if (result.length() > 180) {

                      result =
                              result.substring(
                                      0,
                                      180
                              );
                  }

                  return result;
              }

              @Override
              public void onBackPressed() {

                  if (webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      # =========================================================
      # 15. Build APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradle-8.7/bin/gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # =========================================================
      # 16. Prepare APK
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/SG-CALCI.apk

      # =========================================================
      # 17. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-CALCI-APK
          path: output/SG-CALCI.apk
          if-no-files-found: error
          retention-days: 30
